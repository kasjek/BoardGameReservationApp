# Local PostgreSQL for development (ADR-014).
# Start with: docker compose up -d
# Then point the app at it via DATABASE_URL (see .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: boardgame
      POSTGRES_PASSWORD: boardgame
      POSTGRES_DB: boardgame
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
